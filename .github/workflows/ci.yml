name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build / vet / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code || (echo "go.mod or go.sum is not tidy. Run 'go mod tidy' locally." && exit 1)

      - name: go fix & fmt check
        run: |
          go fix ./...
          go fmt ./...
          git diff --exit-code || (echo "Code has pending fixes or formatting. Run 'go fix ./...' and 'go fmt ./...' locally." && exit 1)

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
