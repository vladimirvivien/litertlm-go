name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build / vet / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' locally."
            exit 1
          fi

      - name: go fix & fmt check
        run: |
          go fix ./...
          go fmt ./...
          if ! git diff --exit-code; then
            echo "::error::Code has pending fixes or formatting. Run 'go fix ./...' and 'go fmt ./...' locally."
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
